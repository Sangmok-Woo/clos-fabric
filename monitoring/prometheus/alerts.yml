# 핵심 알람: "붙어야 할 세션이 안 붙었다"를 사람이 아니라 규칙이 잡는다.
# 기대 세션 수는 수집기가 이름 규칙으로 계산해 clos_bgp_peers_expected 로 내보낸다.
# → 리프를 늘려도 이 규칙은 그대로다 (DESIGN: 기대값을 상수로 박지 않는다).
groups:
  - name: clos-fabric
    rules:
      - alert: BGPSessionsBelowExpected
        expr: clos_bgp_peers_established < clos_bgp_peers_expected
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} 세션 부족: {{ $value }} < 기대치"
          description: "{{ $labels.node }}({{ $labels.role }})에서 Established 세션이 기대치보다 적다."

      - alert: RouterUnreachable
        expr: clos_up == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} 응답 없음 (vtysh 실패)"

      - alert: FabricRoutesDropped
        # 리프는 다른 랙 3개 + 자기망 + 루프백들. 경로가 급감하면 광고가 끊긴 것.
        expr: clos_bgp_rib_routes{role="leaf"} < 4
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} RIB 경로 급감: {{ $value }}"

      # ── 2차: 데이터플레인 (실험 01) ──
      # 1차 규칙은 전부 세션·경로를 본다. MTU 장애는 세션이 멀쩡해서 하나도 안 울렸다.
      - alert: InterfaceDropping
        # veth 는 한 번의 드랍을 양쪽 끝(보낸 쪽 TX, 받은 쪽 RX)에 다 적는다 → 링크 단위로 묶는다.
        expr: >
          max by (link) (increase(clos_if_rx_dropped_total[30s])) > 0
          or max by (link) (increase(clos_if_tx_dropped_total[30s])) > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.link }} 링크에서 패킷 드랍 (30초에 {{ $value }}개)"

      - alert: FabricMTUMismatch
        # 패브릭 링크 MTU는 전부 같아야 한다. 기대값은 상수 대신 전체의 중앙값으로 잡는다.
        expr: clos_if_mtu{kind="fabric"} != on() group_left() quantile(0.5, clos_if_mtu{kind="fabric"})
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }}:{{ $labels.ifname }} MTU {{ $value }} — 패브릭의 다른 링크와 다르다"

      # ── 3차: 블랙박스 링크 프로브 (실험 01) ──
      # 장비 카운터는 트래픽이 끊기면 같이 조용해진다. 수집기가 직접 보낸 ping 은 트래픽과 상관없이 결과가 나온다.
      - alert: LinkLargeFrameLoss
        # 작은 건 되는데 MTU 꽉 채운 건 안 된다 = 그 링크 어딘가의 MTU 가 기대보다 작다
        expr: >
          clos_link_probe_success{size="full"} == 0
          and on(node, ifname) clos_link_probe_success{size="small"} == 1
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.link }} 큰 프레임만 실패 — MTU 의심 ({{ $labels.node }}:{{ $labels.ifname }})"

      - alert: LinkProbeDown
        # 작은 ping 도 안 된다 = 링크나 상대 장비가 응답하지 않는다 (BGP hold timer 를 기다리지 않는다)
        expr: clos_link_probe_success{size="small"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.link }} ping 무응답 ({{ $labels.node }}:{{ $labels.ifname }})"

      # ── 4차: RoCE NIC 카운터 (실험 12) ──
      # 스위치 큐 드랍(tc qdisc)은 인터페이스 카운터에 안 잡힌다. RoCE 는 그 손실을 NIC 재전송으로 메우므로 NIC 를 본다.
      - alert: RoceRetransmitting
        # 보낸 패킷 대비 재전송 비율. 실험 12 실측: 손실 0% 에서 0.03%(Soft-RoCE 의 타이머 재전송),
        # 손실 0.1% 에서 0.1%, 손실 1%·인캐스트에서 1% 이상 → 0.2% 를 넘으면 경로 어딘가에서 버려지고 있다
        expr: >
          increase(clos_rdma_completer_retry_err_total[30s])
          / clamp_min(increase(clos_rdma_sent_pkts_total[30s]), 1) > 0.002
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.dev }} RoCE 재전송 {{ $value | humanizePercentage }} — 경로 손실 또는 큐 넘침"

      - alert: RoceQPFailed
        # 재전송 한도(기본 7번)를 넘기면 QP 가 오류 상태가 되고 애플리케이션이 끊긴다
        expr: increase(clos_rdma_retry_exceeded_err_total[1m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.dev }} RoCE QP 재전송 한도 초과 — 연결이 끊겼다"
