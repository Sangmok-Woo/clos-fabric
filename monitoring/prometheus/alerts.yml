# 핵심 알람: "붙어야 할 세션이 안 붙었다"를 사람이 아니라 규칙이 잡는다.
# 기대 세션 수는 수집기가 이름 규칙으로 계산해 clos_bgp_peers_expected 로 내보낸다.
# → 리프를 늘려도 이 규칙은 그대로다 (DESIGN: 기대값을 상수로 박지 않는다).
groups:
  - name: clos-fabric
    rules:
      - alert: BGPSessionsBelowExpected
        expr: clos_bgp_peers_established < clos_bgp_peers_expected
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} 세션 부족: {{ $value }} < 기대치"
          description: "{{ $labels.node }}({{ $labels.role }})에서 Established 세션이 기대치보다 적다."

      - alert: RouterUnreachable
        expr: clos_up == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} 응답 없음 (vtysh 실패)"

      - alert: FabricRoutesDropped
        # 리프는 다른 랙 3개 + 자기망 + 루프백들. 경로가 급감하면 광고가 끊긴 것.
        expr: clos_bgp_rib_routes{role="leaf"} < 4
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} RIB 경로 급감: {{ $value }}"

      # ── 2차: 데이터플레인 (실험 02) ──
      # 1차 규칙은 전부 세션·경로를 본다. MTU 장애는 세션이 멀쩡해서 하나도 안 울렸다.
      - alert: InterfaceDropping
        # veth 는 한 번의 드랍을 양쪽 끝(보낸 쪽 TX, 받은 쪽 RX)에 다 적는다 → 링크 단위로 묶는다.
        expr: >
          max by (link) (increase(clos_if_rx_dropped_total[30s])) > 0
          or max by (link) (increase(clos_if_tx_dropped_total[30s])) > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.link }} 링크에서 패킷 드랍 (30초에 {{ $value }}개)"

      - alert: FabricMTUMismatch
        # 패브릭 링크 MTU는 전부 같아야 한다. 기대값은 상수 대신 전체의 중앙값으로 잡는다.
        expr: clos_if_mtu{kind="fabric"} != on() group_left() quantile(0.5, clos_if_mtu{kind="fabric"})
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }}:{{ $labels.ifname }} MTU {{ $value }} — 패브릭의 다른 링크와 다르다"
