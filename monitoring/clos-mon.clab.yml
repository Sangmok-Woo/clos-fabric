name: clos

# 모니터링 시나리오용 토폴로지 = 베이스 패브릭(../clos.clab.yml) + 관측 스택 3대.
# 이름을 'clos'로 두어 컨테이너가 clab-clos-* 가 되게 한다 → failover.sh 등 기존
# 스크립트가 그대로 동작한다. 베이스와 같은 이름이라, 이 토폴로지를 올리면 베이스를
# 대체한다(둘 중 하나만 떠 있는다). 설정 파일은 ../configs 를 그대로 재사용한다.

topology:
  defaults:
    kind: linux

  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1

  nodes:
    # ── 베이스 패브릭 (../configs 재사용) ─────────────────────────────
    spine1:
      binds:
        - ../configs/daemons:/etc/frr/daemons:ro
        - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - ../configs/spine1/frr.conf:/etc/frr/frr.conf:ro
    spine2:
      binds:
        - ../configs/daemons:/etc/frr/daemons:ro
        - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - ../configs/spine2/frr.conf:/etc/frr/frr.conf:ro
    leaf1:
      binds:
        - ../configs/daemons:/etc/frr/daemons:ro
        - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - ../configs/leaf1/frr.conf:/etc/frr/frr.conf:ro
    leaf2:
      binds:
        - ../configs/daemons:/etc/frr/daemons:ro
        - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - ../configs/leaf2/frr.conf:/etc/frr/frr.conf:ro
    leaf3:
      binds:
        - ../configs/daemons:/etc/frr/daemons:ro
        - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - ../configs/leaf3/frr.conf:/etc/frr/frr.conf:ro
    leaf4:
      binds:
        - ../configs/daemons:/etc/frr/daemons:ro
        - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - ../configs/leaf4/frr.conf:/etc/frr/frr.conf:ro

    h1:
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.11.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.11.1
    h2:
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.12.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.12.1
    h3:
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.13.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.13.1
    h4:
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.14.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.14.1
    v1:
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - ip link set eth1 up
    v3:
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 10.10.10.33/24 dev eth1
        - ip link set eth1 up

    # ── 관측 스택 ────────────────────────────────────────────────────
    # 수집기: 호스트 docker 소켓으로 라우터에 docker exec → vtysh json 을 긁는다.
    exporter:
      image: clos-mon-exporter:latest
      binds:
        - /var/run/docker.sock:/var/run/docker.sock

    prometheus:
      image: prom/prometheus:v2.54.1
      binds:
        - prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      ports:
        - "9090:9090"
      cmd: "--config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle"

    grafana:
      image: grafana/grafana:11.2.0
      env:
        GF_SECURITY_ADMIN_PASSWORD: admin
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_USERS_DEFAULT_THEME: light
      binds:
        - grafana/provisioning:/etc/grafana/provisioning:ro
        - grafana/dashboards:/var/lib/grafana/dashboards:ro
      ports:
        - "3000:3000"

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]
    - endpoints: ["leaf1:eth3", "h1:eth1"]
    - endpoints: ["leaf2:eth3", "h2:eth1"]
    - endpoints: ["leaf3:eth3", "h3:eth1"]
    - endpoints: ["leaf4:eth3", "h4:eth1"]
    - endpoints: ["leaf1:eth4", "v1:eth1"]
    - endpoints: ["leaf3:eth4", "v3:eth1"]
