! 리프 EVPN 오버레이. 베이스 frr.conf 위에 덧붙인다 (up.sh가 @AS@·@RID@를 채워 vtysh -f로 읽힌다)
! RT는 자동값(내 AS:VNI)이면 eBGP 패브릭에서 리프끼리 안 맞는다 → 공통값 65000:VNI를 박는다
vrf PROD
 vni 50010
exit-vrf
!
vrf STORAGE
 vni 50020
exit-vrf
!
vrf REPL
 vni 50030
exit-vrf
!
! K8s 노드가 광고해도 되는 것은 LB VIP와 노드별 Pod 대역뿐
ip prefix-list K8S-IN seq 10 permit 10.10.32.0/24 le 32
ip prefix-list K8S-IN seq 20 permit 10.20.0.0/16 ge 24 le 24
ip prefix-list K8S-IN seq 99 deny any
ip prefix-list DENY-ALL seq 5 deny any
!
router bgp @AS@
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
  vni 10110
   route-target import 65000:10110
   route-target export 65000:10110
  exit-vni
  vni 10120
   route-target import 65000:10120
   route-target export 65000:10120
  exit-vni
  vni 10130
   route-target import 65000:10130
   route-target export 65000:10130
  exit-vni
 exit-address-family
exit
!
router bgp @AS@ vrf PROD
 bgp router-id @RID@
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor K8S peer-group
 neighbor K8S remote-as 65200
 neighbor K8S timers 3 9
 bgp listen range 10.10.16.0/24 peer-group K8S
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 64
  neighbor K8S prefix-list K8S-IN in
  neighbor K8S prefix-list DENY-ALL out
  neighbor K8S maximum-prefix 300
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50010
  route-target export 65000:50010
 exit-address-family
exit
!
router bgp @AS@ vrf STORAGE
 bgp router-id @RID@
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50020
  route-target export 65000:50020
 exit-address-family
exit
!
router bgp @AS@ vrf REPL
 bgp router-id @RID@
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50030
  route-target export 65000:50030
 exit-address-family
exit
!
