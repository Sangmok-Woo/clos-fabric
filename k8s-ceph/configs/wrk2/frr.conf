! wrk2 — K8s 노드의 BGP 스피커 (운영에서는 Cilium BGP Control Plane / MetalLB) — Ingress VIP 10.10.32.10 광고
frr version 10.2
frr defaults datacenter
hostname wrk2
log stdout informational
!
router bgp 65200
 bgp router-id 10.10.16.22
 no bgp ebgp-requires-policy
 neighbor 10.10.16.1 remote-as external
 neighbor 10.10.16.1 timers 3 9
 !
 address-family ipv4 unicast
  network 10.10.32.10/32
 exit-address-family
exit
!
