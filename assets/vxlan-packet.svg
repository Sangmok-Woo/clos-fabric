<svg viewBox="0 0 940 1120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <text x="470" y="34" text-anchor="middle" fill="#8b949e" font-size="20" font-weight="800">VXLAN 캡슐화 — 와이어를 지나는 패킷의 실제 구조</text>
  <text x="470" y="58" text-anchor="middle" fill="#8b949e" font-size="12.5">leaf1(VTEP)이 v1의 이더넷 프레임을 통째로 UDP 안에 넣어 leaf3으로 보낸다 · 이 랩 실측값(VNI 10010) 기준</text>

  <!-- ── 와이어 바이트 순서 띠 ── -->
  <text x="40" y="92" fill="#8b949e" font-size="12.5" font-weight="700">① 와이어 위 바이트 순서 (왼쪽이 먼저 나간다)</text>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="40" y="102" width="118" height="46" rx="5" fill="#4f46e5"/>
    <text x="99" y="124" fill="#fff">Outer Eth</text><text x="99" y="139" fill="#fff" fill-opacity="0.8" font-weight="400">14B</text>
    <rect x="162" y="102" width="118" height="46" rx="5" fill="#4338ca"/>
    <text x="221" y="124" fill="#fff">Outer IP</text><text x="221" y="139" fill="#fff" fill-opacity="0.8" font-weight="400">20B</text>
    <rect x="284" y="102" width="102" height="46" rx="5" fill="#6d28d9"/>
    <text x="335" y="124" fill="#fff">Outer UDP</text><text x="335" y="139" fill="#fff" fill-opacity="0.8" font-weight="400">8B</text>
    <rect x="390" y="102" width="102" height="46" rx="5" fill="#9333ea"/>
    <text x="441" y="124" fill="#fff">VXLAN</text><text x="441" y="139" fill="#fff" fill-opacity="0.8" font-weight="400">8B</text>
    <rect x="496" y="102" width="360" height="46" rx="5" fill="#0d9488"/>
    <text x="676" y="124" fill="#fff">원본 이더넷 프레임 (v1 → v3) — 그대로 실려간다</text>
    <text x="676" y="139" fill="#fff" fill-opacity="0.8" font-weight="400">Inner Eth + Inner IP + payload</text>
    <rect x="860" y="102" width="40" height="46" rx="5" fill="#475569"/>
    <text x="880" y="124" fill="#fff">FCS</text><text x="880" y="139" fill="#fff" fill-opacity="0.8" font-weight="400">4B</text>
  </g>
  <g stroke="#9333ea" stroke-width="1.4" fill="none" stroke-dasharray="4 3">
    <line x1="40" y1="156" x2="496" y2="156"/><line x1="40" y1="156" x2="40" y2="150"/><line x1="496" y1="156" x2="496" y2="150"/>
  </g>
  <text x="268" y="172" text-anchor="middle" fill="#9333ea" font-size="12" font-weight="700">VTEP가 새로 붙인 겉포장 = 50바이트</text>
  <text x="676" y="172" text-anchor="middle" fill="#0d9488" font-size="12" font-weight="700">건드리지 않은 원본 (VTEP는 이 안을 열지 않는다)</text>

  <!-- ── ② Outer Ethernet ── -->
  <g>
    <rect x="40" y="200" width="860" height="96" rx="8" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
    <rect x="40" y="200" width="200" height="96" rx="8" fill="#4f46e5" fill-opacity="0.12"/>
    <text x="58" y="228" fill="#4f46e5" font-size="15" font-weight="800">Outer Ethernet</text>
    <text x="58" y="248" fill="#8b949e" font-size="11.5">홉마다 새로 쓰인다</text>
    <text x="58" y="266" fill="#8b949e" font-size="11.5">(leaf↔spine 링크의 MAC)</text>
    <text x="58" y="284" fill="#8b949e" font-size="11.5">→ 캡처 위치마다 값이 다름</text>
  </g>
  <g font-size="12">
    <rect x="256" y="216" width="200" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="266" y="238" fill="#8b949e">Dst MAC (6B)</text><text x="266" y="262" fill="#e6edf3" font-weight="700">다음 홉 인터페이스</text>
    <rect x="468" y="216" width="200" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="478" y="238" fill="#8b949e">Src MAC (6B)</text><text x="478" y="262" fill="#e6edf3" font-weight="700">보내는 인터페이스</text>
    <rect x="680" y="216" width="204" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="690" y="238" fill="#8b949e">EtherType (2B)</text><text x="690" y="262" fill="#e6edf3" font-weight="700">0x0800 (IPv4)</text>
  </g>

  <!-- ── ③ Outer IP ── -->
  <g>
    <rect x="40" y="312" width="860" height="96" rx="8" fill="none" stroke="#4338ca" stroke-width="1.6"/>
    <rect x="40" y="312" width="200" height="96" rx="8" fill="#4338ca" fill-opacity="0.12"/>
    <text x="58" y="340" fill="#6366f1" font-size="15" font-weight="800">Outer IP</text>
    <text x="58" y="360" fill="#8b949e" font-size="11.5">VTEP 루프백끼리.</text>
    <text x="58" y="378" fill="#8b949e" font-size="11.5">언더레이는 이 주소만</text>
    <text x="58" y="396" fill="#8b949e" font-size="11.5">보고 라우팅한다</text>
  </g>
  <g font-size="12">
    <rect x="256" y="328" width="200" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="266" y="350" fill="#8b949e">Src IP (VTEP)</text><text x="266" y="374" fill="#e6edf3" font-weight="700">10.255.1.1 · leaf1</text>
    <rect x="468" y="328" width="200" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="478" y="350" fill="#8b949e">Dst IP (VTEP)</text><text x="478" y="374" fill="#e6edf3" font-weight="700">10.255.1.3 · leaf3</text>
    <rect x="680" y="328" width="204" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="690" y="350" fill="#8b949e">Protocol (1B)</text><text x="690" y="374" fill="#e6edf3" font-weight="700">17 (UDP)</text>
  </g>

  <!-- ── ④ Outer UDP ── -->
  <g>
    <rect x="40" y="424" width="860" height="96" rx="8" fill="none" stroke="#6d28d9" stroke-width="1.6"/>
    <rect x="40" y="424" width="200" height="96" rx="8" fill="#6d28d9" fill-opacity="0.12"/>
    <text x="58" y="452" fill="#8b5cf6" font-size="15" font-weight="800">Outer UDP</text>
    <text x="58" y="472" fill="#8b949e" font-size="11.5">ECMP가 링크를 고르는</text>
    <text x="58" y="490" fill="#8b949e" font-size="11.5">근거가 바로 여기 있다</text>
  </g>
  <g font-size="12">
    <rect x="256" y="440" width="304" height="64" rx="5" fill="#0d1117" stroke="#f0883e" stroke-width="1.6"/>
    <text x="266" y="462" fill="#f0883e">Src Port (2B) — 핵심</text>
    <text x="266" y="486" fill="#e6edf3" font-weight="700">원본 프레임을 해시한 값 (엔트로피)</text>
    <rect x="572" y="440" width="150" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="582" y="462" fill="#8b949e">Dst Port (2B)</text><text x="582" y="486" fill="#e6edf3" font-weight="700">4789</text>
    <rect x="734" y="440" width="150" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="744" y="462" fill="#8b949e">Length / Csum</text><text x="744" y="486" fill="#e6edf3" font-weight="700">4B</text>
  </g>
  <text x="408" y="537" text-anchor="middle" fill="#f0883e" font-size="11.5">↑ 안쪽 흐름이 다르면 Src Port가 달라진다 → 스파인이 이걸 해시해 링크를 가른다 (겉IP는 항상 같은데도 ECMP가 되는 이유)</text>

  <!-- ── ⑤ VXLAN header ── -->
  <g>
    <rect x="40" y="556" width="860" height="96" rx="8" fill="none" stroke="#9333ea" stroke-width="1.6"/>
    <rect x="40" y="556" width="200" height="96" rx="8" fill="#9333ea" fill-opacity="0.14"/>
    <text x="58" y="584" fill="#a855f7" font-size="15" font-weight="800">VXLAN 헤더</text>
    <text x="58" y="604" fill="#8b949e" font-size="11.5">8바이트. 이 상자가</text>
    <text x="58" y="622" fill="#8b949e" font-size="11.5">어느 가상랜 것인지를</text>
    <text x="58" y="640" fill="#8b949e" font-size="11.5">VNI 하나로 표시</text>
  </g>
  <g font-size="12">
    <rect x="256" y="572" width="150" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="266" y="594" fill="#8b949e">Flags (1B)</text><text x="266" y="618" fill="#e6edf3" font-weight="700">0x08 (I=1)</text>
    <rect x="418" y="572" width="120" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="428" y="594" fill="#8b949e">Reserved</text><text x="428" y="618" fill="#e6edf3" font-weight="700">3B</text>
    <rect x="550" y="572" width="200" height="64" rx="5" fill="#0d1117" stroke="#9333ea" stroke-width="1.6"/>
    <text x="560" y="594" fill="#a855f7">VNI (24bit = 3B)</text><text x="560" y="618" fill="#e6edf3" font-weight="700">10010 ← VLAN 10</text>
    <rect x="762" y="572" width="122" height="64" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="772" y="594" fill="#8b949e">Reserved</text><text x="772" y="618" fill="#e6edf3" font-weight="700">1B</text>
  </g>

  <!-- ── ⑥ Inner frame ── -->
  <g>
    <rect x="40" y="672" width="860" height="120" rx="8" fill="none" stroke="#0d9488" stroke-width="1.6"/>
    <rect x="40" y="672" width="200" height="120" rx="8" fill="#0d9488" fill-opacity="0.12"/>
    <text x="58" y="700" fill="#14b8a6" font-size="15" font-weight="800">원본 프레임</text>
    <text x="58" y="720" fill="#8b949e" font-size="11.5">v1이 원래 보낸 그대로.</text>
    <text x="58" y="738" fill="#8b949e" font-size="11.5">v1·v3은 자기들이</text>
    <text x="58" y="756" fill="#8b949e" font-size="11.5">같은 랜에 있는 줄 안다</text>
    <text x="58" y="778" fill="#8b949e" font-size="11.5">(터널을 모른다)</text>
  </g>
  <g font-size="11.5">
    <rect x="256" y="688" width="300" height="42" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="266" y="705" fill="#8b949e">Inner Dst MAC — v3</text><text x="266" y="722" fill="#e6edf3" font-weight="700">aa:c1:ab:17:72:1c</text>
    <rect x="568" y="688" width="316" height="42" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="578" y="705" fill="#8b949e">Inner Src MAC — v1</text><text x="578" y="722" fill="#e6edf3" font-weight="700">aa:c1:ab:59:71:b7</text>
    <rect x="256" y="738" width="300" height="42" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="266" y="755" fill="#8b949e">Inner Src IP</text><text x="266" y="772" fill="#e6edf3" font-weight="700">10.10.10.11 (v1)</text>
    <rect x="568" y="738" width="316" height="42" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="578" y="755" fill="#8b949e">Inner Dst IP</text><text x="578" y="772" fill="#e6edf3" font-weight="700">10.10.10.33 (v3)</text>
  </g>

  <!-- ── 캡처 팁 & MTU ── -->
  <text x="40" y="836" fill="#8b949e" font-size="12.5" font-weight="700">② Wireshark로 볼 때</text>
  <g font-size="12">
    <rect x="40" y="850" width="415" height="120" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="58" y="874" fill="#e6edf3" font-weight="700">필터</text>
    <text x="58" y="896" fill="#8b949e">udp.port == 4789          ← VXLAN 트래픽만</text>
    <text x="58" y="916" fill="#8b949e">vxlan.vni == 10010        ← 특정 가상랜만</text>
    <text x="58" y="938" fill="#8b949e">Wireshark는 4789를 보면 안쪽을</text>
    <text x="58" y="956" fill="#8b949e">자동으로 풀어 Inner까지 트리로 보여준다</text>
  </g>
  <g font-size="12">
    <rect x="469" y="850" width="415" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-opacity="0.5"/>
    <text x="487" y="874" fill="#f85149" font-weight="700">왜 +50바이트가 중요한가 (MTU)</text>
    <text x="487" y="896" fill="#8b949e">원본이 1500B면 겉포장 뒤 1550B가 된다.</text>
    <text x="487" y="916" fill="#8b949e">언더레이 MTU가 1500이면 조각나거나 버려짐.</text>
    <text x="487" y="938" fill="#8b949e">→ 실무는 언더레이를 점보(9216)로 올린다.</text>
    <text x="487" y="958" fill="#8b949e">지금 랩은 작은 핑만 써서 안 걸렸을 뿐.</text>
  </g>

  <!-- ── 캡처 지점 ── -->
  <text x="40" y="1002" fill="#8b949e" font-size="12.5" font-weight="700">③ 어디서 캡처하느냐로 보이는 게 달라진다</text>
  <g font-size="12">
    <rect x="40" y="1016" width="270" height="82" rx="8" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-opacity="0.5"/>
    <text x="58" y="1040" fill="#14b8a6" font-weight="700">v1 ↔ leaf 링크 (서버 앞)</text>
    <text x="58" y="1062" fill="#8b949e">겉포장 없는 원본 프레임.</text>
    <text x="58" y="1080" fill="#8b949e">평범한 이더넷으로 보인다</text>
    <rect x="326" y="1016" width="270" height="82" rx="8" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-opacity="0.5"/>
    <text x="344" y="1040" fill="#a855f7" font-weight="700">leaf ↔ spine 링크 (패브릭 안)</text>
    <text x="344" y="1062" fill="#8b949e">VXLAN으로 캡슐화된 상태.</text>
    <text x="344" y="1080" fill="#8b949e">udp.port==4789로 잡힌다</text>
    <rect x="612" y="1016" width="272" height="82" rx="8" fill="#475569" fill-opacity="0.18" stroke="#8b949e" stroke-opacity="0.4"/>
    <text x="630" y="1040" fill="#e6edf3" font-weight="700">스파인에서 캡처하면</text>
    <text x="630" y="1062" fill="#8b949e">겉IP는 VTEP끼리라 스파인은</text>
    <text x="630" y="1080" fill="#8b949e">안쪽 v1·v3을 모른 채 중계만</text>
  </g>
</svg>
