<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <!-- 장비 번호 하나에서 이름·AS·주소·포트가 전부 계산되어 나오는 모습 (leaf3 예시) -->
  <text x="450" y="28" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="700">번호 하나에서 전부 계산한다 — leaf3의 경우</text>

  <!-- 출발점 -->
  <g stroke="#8b949e" stroke-width="1.4" stroke-opacity="0.5" fill="none">
    <path d="M200,195 C245,195 245,69 290,69"/>
    <path d="M200,195 C245,195 245,115 290,115"/>
    <path d="M200,195 C245,195 245,161 290,161"/>
    <path d="M200,195 C245,195 245,207 290,207"/>
    <path d="M200,195 C245,195 245,253 290,253"/>
    <path d="M200,195 C245,195 245,299 290,299"/>
  </g>
  <circle cx="130" cy="195" r="70" fill="#0d9488"/>
  <text x="130" y="185" text-anchor="middle" fill="#fff" font-size="14">leaf</text>
  <text x="130" y="222" text-anchor="middle" fill="#fff" font-size="44" font-weight="700">3</text>

  <!-- 행: 항목 | 계산식 | 결과 -->
  <g font-size="12.5">
    <g>
      <rect x="290" y="52" width="100" height="34" rx="7" fill="#475569"/>
      <text x="340" y="74" text-anchor="middle" fill="#fff" font-weight="600">이름</text>
      <text x="406" y="74" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">leaf&lt;번호&gt;, h&lt;리프번호&gt;</text>
      <text x="870" y="74" text-anchor="end" fill="#0d9488" font-weight="700">leaf3, 서버 h3</text>
    </g>
    <g>
      <rect x="290" y="98" width="100" height="34" rx="7" fill="#475569"/>
      <text x="340" y="120" text-anchor="middle" fill="#fff" font-weight="600">AS</text>
      <text x="406" y="120" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">65100 + 번호</text>
      <text x="870" y="120" text-anchor="end" fill="#0d9488" font-weight="700">65103</text>
    </g>
    <g>
      <rect x="290" y="144" width="100" height="34" rx="7" fill="#475569"/>
      <text x="340" y="166" text-anchor="middle" fill="#fff" font-weight="600">루프백</text>
      <text x="406" y="166" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">10.255.1.&lt;번호&gt;/32</text>
      <text x="870" y="166" text-anchor="end" fill="#0d9488" font-weight="700">10.255.1.3/32</text>
    </g>
    <g>
      <rect x="290" y="190" width="100" height="34" rx="7" fill="#475569"/>
      <text x="340" y="212" text-anchor="middle" fill="#fff" font-weight="600">서버망</text>
      <text x="406" y="212" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">172.16.&lt;리프번호&gt;.0/24, GW .1</text>
      <text x="870" y="212" text-anchor="end" fill="#0d9488" font-weight="700">172.16.3.0/24, GW 172.16.3.1</text>
    </g>
    <g>
      <rect x="290" y="236" width="100" height="34" rx="7" fill="#475569"/>
      <text x="340" y="258" text-anchor="middle" fill="#fff" font-weight="600">스파인 포트</text>
      <text x="406" y="258" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">eth&lt;리프번호&gt;</text>
      <text x="870" y="258" text-anchor="end" fill="#0d9488" font-weight="700">spine1·spine2의 eth3</text>
    </g>
    <g>
      <rect x="290" y="282" width="100" height="34" rx="7" fill="#475569"/>
      <text x="340" y="304" text-anchor="middle" fill="#fff" font-weight="600">리프 포트</text>
      <text x="406" y="304" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">고정 구간</text>
      <text x="870" y="304" text-anchor="end" fill="#0d9488" font-weight="700">eth1~10 업링크 예약, eth11~ 서버</text>
    </g>
  </g>

  <!-- 아래: 스파인과 VNI도 같은 방식 -->
  <line x1="40" y1="340" x2="860" y2="340" stroke="#8b949e" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <g font-size="12.5">
    <rect x="40" y="356" width="390" height="44" rx="9" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-opacity="0.5"/>
    <text x="56" y="383" fill="#8b949e">스파인도 같다  <tspan fill="#4f46e5" font-weight="700">spine2</tspan> → AS 65002, 10.255.0.2/32</text>
    <rect x="450" y="356" width="410" height="44" rx="9" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.5"/>
    <text x="466" y="383" fill="#8b949e">VNI = 10000 + VLAN  →  <tspan fill="#7c3aed" font-weight="700">10010</tspan>, RT 65000:10010 고정</text>
  </g>
</svg>
