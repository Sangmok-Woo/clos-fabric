<svg viewBox="0 0 900 390" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <!-- 왼쪽: 3계층 트리 / 오른쪽: spine-leaf. 같은 East-West 통신이 지나는 경로 비교 -->
  <line x1="450" y1="20" x2="450" y2="370" stroke="#8b949e" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- ═══ 3계층 ═══ -->
  <text x="225" y="34" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="700">3계층 (코어–배포–액세스)</text>
  <g stroke="#8b949e" stroke-width="1.6" stroke-opacity="0.5">
    <line x1="225" y1="90" x2="125" y2="170"/><line x1="225" y1="90" x2="325" y2="170"/>
    <line x1="125" y1="170" x2="75" y2="250"/><line x1="125" y1="170" x2="175" y2="250"/>
    <line x1="325" y1="170" x2="275" y2="250"/><line x1="325" y1="170" x2="375" y2="250"/>
  </g>
  <!-- 배포를 넘는 경로: 꼭대기까지 올라갔다 내려온다 -->
  <polyline points="175,250 125,170 225,90 325,170 275,250" fill="none" stroke="#f0883e" stroke-width="4" stroke-linejoin="round" stroke-opacity="0.85"/>
  <!-- 같은 배포 아래 경로 -->
  <polyline points="75,250 125,170 175,250" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <g font-size="12" font-weight="600" fill="#fff" text-anchor="middle">
    <rect x="185" y="74" width="80" height="32" rx="8" fill="#475569"/><text x="225" y="95">코어</text>
    <rect x="85" y="154" width="80" height="32" rx="8" fill="#475569"/><text x="125" y="175">배포</text>
    <rect x="285" y="154" width="80" height="32" rx="8" fill="#475569"/><text x="325" y="175">배포</text>
    <rect x="40" y="234" width="70" height="32" rx="8" fill="#64748b"/><text x="75" y="255">랙 A</text>
    <rect x="140" y="234" width="70" height="32" rx="8" fill="#64748b"/><text x="175" y="255">랙 B</text>
    <rect x="240" y="234" width="70" height="32" rx="8" fill="#64748b"/><text x="275" y="255">랙 C</text>
    <rect x="340" y="234" width="70" height="32" rx="8" fill="#64748b"/><text x="375" y="255">랙 D</text>
  </g>
  <g font-size="12.5">
    <line x1="40" y1="298" x2="62" y2="298" stroke="#58a6ff" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="70" y="302" fill="#58a6ff">A → B  같은 배포 아래: 3홉</text>
    <line x1="40" y1="322" x2="62" y2="322" stroke="#f0883e" stroke-width="4"/>
    <text x="70" y="326" fill="#f0883e">B → C  배포를 넘으면: 5홉, 꼭대기 경유</text>
  </g>
  <text x="225" y="356" text-anchor="middle" fill="#8b949e" font-size="12">랙 위치에 따라 경로 길이가 다르고, East-West가 위로 몰린다</text>

  <!-- ═══ spine-leaf ═══ -->
  <text x="675" y="34" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="700">spine-leaf (Clos)</text>
  <g stroke="#8b949e" stroke-width="1.6" stroke-opacity="0.5">
    <line x1="580" y1="90" x2="520" y2="220"/><line x1="580" y1="90" x2="620" y2="220"/>
    <line x1="580" y1="90" x2="720" y2="220"/><line x1="580" y1="90" x2="820" y2="220"/>
    <line x1="770" y1="90" x2="520" y2="220"/><line x1="770" y1="90" x2="620" y2="220"/>
    <line x1="770" y1="90" x2="720" y2="220"/><line x1="770" y1="90" x2="820" y2="220"/>
  </g>
  <!-- 증설: 스파인 하나 추가 = 리프마다 한 가닥 -->
  <g stroke="#8b949e" stroke-width="1.3" stroke-opacity="0.55" stroke-dasharray="4 4">
    <line x1="675" y1="90" x2="520" y2="220"/><line x1="675" y1="90" x2="620" y2="220"/>
    <line x1="675" y1="90" x2="720" y2="220"/><line x1="675" y1="90" x2="820" y2="220"/>
  </g>
  <polyline points="520,220 580,90 820,220" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round" stroke-opacity="0.85"/>
  <g font-size="12" font-weight="600" fill="#fff" text-anchor="middle">
    <rect x="540" y="72" width="80" height="34" rx="8" fill="#4f46e5"/><text x="580" y="94">spine1</text>
    <rect x="730" y="72" width="80" height="34" rx="8" fill="#4f46e5"/><text x="770" y="94">spine2</text>
    <rect x="490" y="204" width="60" height="32" rx="8" fill="#0d9488"/><text x="520" y="225">leaf1</text>
    <rect x="590" y="204" width="60" height="32" rx="8" fill="#0d9488"/><text x="620" y="225">leaf2</text>
    <rect x="690" y="204" width="60" height="32" rx="8" fill="#0d9488"/><text x="720" y="225">leaf3</text>
    <rect x="790" y="204" width="60" height="32" rx="8" fill="#0d9488"/><text x="820" y="225">leaf4</text>
  </g>
  <rect x="640" y="74" width="70" height="30" rx="8" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="675" y="94" text-anchor="middle" fill="#8b949e" font-size="11.5">스파인 +1</text>
  <text x="675" y="58" text-anchor="middle" fill="#8b949e" font-size="11">스파인끼리는 연결하지 않는다</text>
  <g font-size="12.5">
    <line x1="490" y1="298" x2="512" y2="298" stroke="#58a6ff" stroke-width="4"/>
    <text x="520" y="302" fill="#58a6ff">어느 리프 사이든 리프 → 스파인 → 리프 3홉</text>
    <line x1="490" y1="322" x2="512" y2="322" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="520" y="326" fill="#8b949e">증설은 가로로: 스파인 1대 = 리프마다 한 가닥</text>
  </g>
  <text x="675" y="356" text-anchor="middle" fill="#8b949e" font-size="12">경로가 균일해 지연을 예측할 수 있다</text>
</svg>
