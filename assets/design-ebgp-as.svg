<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <!-- 장비마다 AS 하나(RFC 7938). leaf1이 leaf4로 가는 두 경로가 multipath-relax로 ECMP가 되는 이유 -->
  <text x="450" y="28" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="700">장비마다 AS 하나 — 스파인 65000+번호, 리프 65100+번호</text>

  <g stroke="#8b949e" stroke-width="1.6" stroke-opacity="0.45">
    <line x1="300" y1="112" x2="120" y2="222"/><line x1="300" y1="112" x2="340" y2="222"/>
    <line x1="300" y1="112" x2="560" y2="222"/><line x1="300" y1="112" x2="780" y2="222"/>
    <line x1="600" y1="112" x2="120" y2="222"/><line x1="600" y1="112" x2="340" y2="222"/>
    <line x1="600" y1="112" x2="560" y2="222"/><line x1="600" y1="112" x2="780" y2="222"/>
  </g>
  <!-- leaf1 → leaf4 두 경로 -->
  <polyline points="120,222 300,112 780,222" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round" stroke-opacity="0.85"/>
  <polyline points="120,222 600,112 780,222" fill="none" stroke="#f0883e" stroke-width="4" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- AS 경계(점선) + 장비 -->
  <g fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.8">
    <rect x="215" y="50" width="170" height="70" rx="12"/><rect x="515" y="50" width="170" height="70" rx="12"/>
    <rect x="45" y="214" width="150" height="70" rx="12"/><rect x="265" y="214" width="150" height="70" rx="12"/>
    <rect x="485" y="214" width="150" height="70" rx="12"/><rect x="705" y="214" width="150" height="70" rx="12"/>
  </g>
  <g fill="#fff" text-anchor="middle">
    <rect x="235" y="58" width="130" height="54" rx="9" fill="#4f46e5"/>
    <text x="300" y="80" font-size="13" font-weight="700">spine1</text><text x="300" y="100" font-size="12">AS 65001</text>
    <rect x="535" y="58" width="130" height="54" rx="9" fill="#4f46e5"/>
    <text x="600" y="80" font-size="13" font-weight="700">spine2</text><text x="600" y="100" font-size="12">AS 65002</text>
    <rect x="60" y="222" width="120" height="54" rx="9" fill="#0d9488"/>
    <text x="120" y="244" font-size="13" font-weight="700">leaf1</text><text x="120" y="264" font-size="12">AS 65101</text>
    <rect x="280" y="222" width="120" height="54" rx="9" fill="#0d9488"/>
    <text x="340" y="244" font-size="13" font-weight="700">leaf2</text><text x="340" y="264" font-size="12">AS 65102</text>
    <rect x="500" y="222" width="120" height="54" rx="9" fill="#0d9488"/>
    <text x="560" y="244" font-size="13" font-weight="700">leaf3</text><text x="560" y="264" font-size="12">AS 65103</text>
    <rect x="720" y="222" width="120" height="54" rx="9" fill="#0d9488"/>
    <text x="780" y="244" font-size="13" font-weight="700">leaf4</text><text x="780" y="264" font-size="12">AS 65104</text>
  </g>
  <text x="450" y="306" text-anchor="middle" fill="#8b949e" font-size="11.5">점선 상자 하나가 AS 하나. 자기 AS가 들어 있는 경로는 버리므로 RR 없이 루프가 막힌다</text>

  <!-- 아래: leaf1이 받는 leaf4 경로 두 개 -->
  <text x="60" y="342" fill="#8b949e" font-size="12.5" font-weight="700">leaf1이 받는 leaf4 루프백 경로</text>
  <g font-size="12.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <line x1="60" y1="365" x2="84" y2="365" stroke="#58a6ff" stroke-width="4"/>
    <text x="94" y="369" fill="#58a6ff">spine1 경유  AS 경로 65001 65104</text>
    <line x1="60" y1="391" x2="84" y2="391" stroke="#f0883e" stroke-width="4"/>
    <text x="94" y="395" fill="#f0883e">spine2 경유  AS 경로 65002 65104</text>
  </g>
  <rect x="470" y="330" width="390" height="82" rx="10" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-opacity="0.5"/>
  <g fill="#8b949e" font-size="12.5">
    <text x="486" y="354">AS 번호는 다르고 길이는 2로 같다</text>
    <text x="486" y="376">기본값: 하나만 쓴다 (스파인 1대만 사용)</text>
    <text x="486" y="398"><tspan font-weight="700">multipath-relax + maximum-paths 64</tspan>: 둘 다 ECMP</text>
  </g>
</svg>
