frr version 10.2
frr defaults datacenter
hostname spine1
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description to-leaf1
 ip address 10.1.1.0/31
!
interface eth2
 description to-leaf2
 ip address 10.1.1.2/31
!
interface eth3
 description to-leaf3
 ip address 10.1.1.4/31
!
interface eth4
 description to-leaf4
 ip address 10.1.1.6/31
!
router bgp 65001
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC advertisement-interval 0
 neighbor FABRIC timers 3 9
 neighbor 10.1.1.1 peer-group FABRIC
 neighbor 10.1.1.1 description leaf1
 neighbor 10.1.1.3 peer-group FABRIC
 neighbor 10.1.1.3 description leaf2
 neighbor 10.1.1.5 peer-group FABRIC
 neighbor 10.1.1.5 description leaf3
 neighbor 10.1.1.7 peer-group FABRIC
 neighbor 10.1.1.7 description leaf4
 !
 address-family ipv4 unicast
  network 10.255.0.1/32
  neighbor FABRIC activate
  maximum-paths 64
 exit-address-family
!
line vty
