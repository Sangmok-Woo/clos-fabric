name: grlab

# 실험 21 전용 소형 랩: 스파인 2 + 리프 2 + 서버 2. 본 패브릭(clab-clos-*)과 따로 돈다.
# 주소·AS는 본 패브릭과 같은 규칙(링크 10.1.<spine>.x/31, AS 스파인 6500x / 리프 6501x).
# /etc/frr 를 노드별 state/<노드>/ 디렉터리로 쓰기 가능하게 묶는다:
#   watchfrr 가 bgpd 를 다시 띄우면 frr.conf 에서 설정을 다시 읽으므로, GR·BFD 를 켠 상태를 파일에도 써 둬야 한다.
# docker-start 는 watchfrr 재시작 간격만 고친 사본 (configs/docker-start 주석 참고).

mgmt:
  network: grlab-mgmt
  ipv4-subnet: 172.30.21.0/24

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1

  nodes:
    spine1: { kind: linux, binds: [ "state/spine1:/etc/frr", "configs/docker-start:/usr/lib/frr/docker-start:ro" ] }
    spine2: { kind: linux, binds: [ "state/spine2:/etc/frr", "configs/docker-start:/usr/lib/frr/docker-start:ro" ] }
    leaf1:  { kind: linux, binds: [ "state/leaf1:/etc/frr", "configs/docker-start:/usr/lib/frr/docker-start:ro" ] }
    leaf2:  { kind: linux, binds: [ "state/leaf2:/etc/frr", "configs/docker-start:/usr/lib/frr/docker-start:ro" ] }
    h1:
      kind: linux
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.11.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.11.1
    h2:
      kind: linux
      image: alpine:3
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.12.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.12.1

  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf1:eth3", "h1:eth1"]
    - endpoints: ["leaf2:eth3", "h2:eth1"]
