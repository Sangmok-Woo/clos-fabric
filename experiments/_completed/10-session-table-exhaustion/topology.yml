# 10장 — 세션 테이블 고갈 (NAT 포트 고갈)
# 베이스 패브릭(clos.clab.yml)과 따로 뜨는 작은 랩. 컨테이너 이름은 clab-natlab-* 라 clab-clos-* 와 안 겹친다.
#
#   cli1 (연결을 쌓는 쪽, 10.9.1.10~19) ─┐
#                                        nat ── srv (10.9.100.10, 기본 경로 없음)
#   cli2 (나중에 오는 사용자, 10.9.2.10) ─┘   SNAT → 10.9.100.1:<좁힌 포트 범위>
#
# ★ srv 는 기본 경로가 없다. 안쪽(10.9.1/2.x)으로 가는 길을 모르니 NAT 를 거치지 않은 패킷엔 답할 수 없다.
# ★ network-mode: none 은 지우지 말 것. 관리망에 붙이면 도커가 컨테이너 안에 DNS용 NAT 규칙을 깔아
#   cli·srv 에도 conntrack 이 켜진다(12장 실측). 이 랩에서 conntrack 은 nat 노드에만 있어야 한다.
#
# 주소: 10.9.1.0/24 cli1망, 10.9.2.0/24 cli2망, 10.9.100.0/24 바깥(nat .1~.3, srv .10)

name: natlab

topology:
  defaults:
    kind: linux
    image: fwlab:1
    network-mode: none
    binds:
      - .:/lab:ro              # 이 디렉터리가 노드 안 /lab 으로 보인다 (tools/*.py 실행용)

  nodes:
    cli1:
      exec:
        - ip addr add 10.9.1.10/24 dev eth1
        - sh -c 'for i in 11 12 13 14 15 16 17 18 19; do ip addr add 10.9.1.$i/24 dev eth1; done'
        - ip route replace default via 10.9.1.1

    cli2:
      exec:
        - ip addr add 10.9.2.10/24 dev eth1
        - ip route replace default via 10.9.2.1

    nat:
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.9.1.1/24 dev eth1          # cli1 쪽 (안)
        - ip addr add 10.9.2.1/24 dev eth2          # cli2 쪽 (안)
        - ip addr add 10.9.100.1/24 dev eth3        # srv 쪽 (밖). 추가 SNAT 주소 .2 .3 은 run.sh 가 잠깐 붙인다

    srv:
      exec:
        - ip addr add 10.9.100.10/24 dev eth1

  links:
    - endpoints: ["cli1:eth1", "nat:eth1"]
    - endpoints: ["cli2:eth1", "nat:eth2"]
    - endpoints: ["nat:eth3", "srv:eth1"]
