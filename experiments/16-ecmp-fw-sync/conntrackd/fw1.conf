# fw1 conntrackd — 액티브-액티브(비대칭 경로)용.
# DisableExternalCache on: 상대가 보낸 엔트리를 "대기 장부"에 두지 않고 바로 커널 방명록에 넣는다.
# (기본값은 장애 전환 때까지 대기 장부에만 두는 액티브-스탠바이용이라 비대칭 경로를 못 살린다)
Sync {
  Mode FTFW {
    DisableExternalCache on
  }
  UDP {
    IPv4_address 10.15.99.1
    IPv4_Destination_Address 10.15.99.2
    Port 3780
    Interface eth3
    Checksum on
  }
}
General {
  HashSize 8192
  HashLimit 65535
  LogFile /tmp/conntrackd.log
  LockFile /tmp/conntrackd.lock
  UNIX {
    Path /tmp/conntrackd.ctl
  }
  NetlinkBufferSize 2097152
  NetlinkBufferSizeMaxGrowth 8388608
  Filter From Userspace {
    Protocol Accept {
      TCP
      UDP
      ICMP
    }
    Address Ignore {
      IPv4_address 127.0.0.1
      IPv4_address 10.15.99.0/24
    }
  }
}
