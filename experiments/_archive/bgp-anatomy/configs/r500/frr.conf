! r500 — AS500. 관계별 정책은 Gao-Rexford: 고객 LP 200 > 피어 150 > 프로바이더 100.
! 받을 때 관계를 커뮤니티 500:1(고객) / 500:2(피어) / 500:3(프로바이더)로 표시하고,
! 피어·프로바이더에게는 고객 경로와 내 경로만 넘긴다. 내 표시는 나갈 때 지운다.
frr version 10.2.1
frr defaults traditional
hostname r500
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to-r400(provider)
 ip address 10.4.5.2/30
exit
!
interface eth2
 description lan-h500
 ip address 203.0.113.1/24
exit
!
bgp community-list standard FROM-CUST seq 5 permit 500:1
bgp community-list standard MY-TAGS seq 5 permit 500:1
bgp community-list standard MY-TAGS seq 10 permit 500:2
bgp community-list standard MY-TAGS seq 15 permit 500:3
bgp as-path access-list LOCAL seq 5 permit ^$
!
route-map CUST-IN permit 10
 set local-preference 200
 set community 500:1 additive
exit
!
route-map PEER-IN permit 10
 set local-preference 150
 set community 500:2 additive
exit
!
route-map PROV-IN permit 10
 set local-preference 100
 set community 500:3 additive
exit
!
! 고객에게는 전부
route-map TO-CUST permit 10
 set comm-list MY-TAGS delete
exit
!
! 피어·프로바이더에게는 고객 경로 + 내 경로만 (밸리 프리)
route-map TO-UP permit 10
 match community FROM-CUST
 set comm-list MY-TAGS delete
exit
!
route-map TO-UP permit 20
 match as-path LOCAL
exit
!
router bgp 500
 bgp router-id 10.255.255.5
 bgp log-neighbor-changes
 timers bgp 10 30
 neighbor 10.4.5.1 remote-as 400
 neighbor 10.4.5.1 description r400-provider
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.4.5.1 soft-reconfiguration inbound
  neighbor 10.4.5.1 route-map PROV-IN in
  neighbor 10.4.5.1 route-map TO-UP out
 exit-address-family
exit
!
end
