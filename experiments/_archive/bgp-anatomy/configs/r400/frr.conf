! r400 — AS400. 관계별 정책은 Gao-Rexford: 고객 LP 200 > 피어 150 > 프로바이더 100.
! 받을 때 관계를 커뮤니티 400:1(고객) / 400:2(피어) / 400:3(프로바이더)로 표시하고,
! 피어·프로바이더에게는 고객 경로와 내 경로만 넘긴다. 내 표시는 나갈 때 지운다.
frr version 10.2.1
frr defaults traditional
hostname r400
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 description observer
 ip address 100.64.4.1/24
exit
!
interface eth1
 description to-r200(customer)
 ip address 10.2.4.2/30
exit
!
interface eth2
 description to-r300(customer)
 ip address 10.3.4.2/30
exit
!
interface eth3
 description to-r500(customer)
 ip address 10.4.5.1/30
exit
!
bgp community-list standard FROM-CUST seq 5 permit 400:1
bgp community-list standard MY-TAGS seq 5 permit 400:1
bgp community-list standard MY-TAGS seq 10 permit 400:2
bgp community-list standard MY-TAGS seq 15 permit 400:3
bgp as-path access-list LOCAL seq 5 permit ^$
!
route-map CUST-IN permit 10
 set local-preference 200
 set community 400:1 additive
exit
!
route-map PEER-IN permit 10
 set local-preference 150
 set community 400:2 additive
exit
!
route-map PROV-IN permit 10
 set local-preference 100
 set community 400:3 additive
exit
!
! 고객에게는 전부
route-map TO-CUST permit 10
 set comm-list MY-TAGS delete
exit
!
! 피어·프로바이더에게는 고객 경로 + 내 경로만 (밸리 프리)
route-map TO-UP permit 10
 match community FROM-CUST
 set comm-list MY-TAGS delete
exit
!
route-map TO-UP permit 20
 match as-path LOCAL
exit
!
router bgp 400
 bgp router-id 10.255.255.4
 bgp log-neighbor-changes
 timers bgp 10 30
 neighbor 10.2.4.1 remote-as 200
 neighbor 10.2.4.1 description r200-customer
 neighbor 10.3.4.1 remote-as 300
 neighbor 10.3.4.1 description r300-customer
 neighbor 10.4.5.2 remote-as 500
 neighbor 10.4.5.2 description r500-customer
 !
 address-family ipv4 unicast
  network 100.64.4.0/24
  neighbor 10.2.4.1 soft-reconfiguration inbound
  neighbor 10.2.4.1 route-map CUST-IN in
  neighbor 10.2.4.1 route-map TO-CUST out
  neighbor 10.3.4.1 soft-reconfiguration inbound
  neighbor 10.3.4.1 route-map CUST-IN in
  neighbor 10.3.4.1 route-map TO-CUST out
  neighbor 10.4.5.2 soft-reconfiguration inbound
  neighbor 10.4.5.2 route-map CUST-IN in
  neighbor 10.4.5.2 route-map TO-CUST out
 exit-address-family
exit
!
end
