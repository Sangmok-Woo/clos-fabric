! r100 — AS100. 관계별 정책은 Gao-Rexford: 고객 LP 200 > 피어 150 > 프로바이더 100.
! 받을 때 관계를 커뮤니티 100:1(고객) / 100:2(피어) / 100:3(프로바이더)로 표시하고,
! 피어·프로바이더에게는 고객 경로와 내 경로만 넘긴다. 내 표시는 나갈 때 지운다.
frr version 10.2.1
frr defaults traditional
hostname r100
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to-r200(provider)
 ip address 10.1.2.1/30
exit
!
interface eth2
 description to-r300(provider)
 ip address 10.1.3.1/30
exit
!
interface eth3
 description lan-h100
 ip address 198.51.100.1/24
exit
!
bgp community-list standard FROM-CUST seq 5 permit 100:1
bgp community-list standard MY-TAGS seq 5 permit 100:1
bgp community-list standard MY-TAGS seq 10 permit 100:2
bgp community-list standard MY-TAGS seq 15 permit 100:3
bgp as-path access-list LOCAL seq 5 permit ^$
!
route-map CUST-IN permit 10
 set local-preference 200
 set community 100:1 additive
exit
!
route-map PEER-IN permit 10
 set local-preference 150
 set community 100:2 additive
exit
!
route-map PROV-IN permit 10
 set local-preference 100
 set community 100:3 additive
exit
!
! 고객에게는 전부
route-map TO-CUST permit 10
 set comm-list MY-TAGS delete
exit
!
! 피어·프로바이더에게는 고객 경로 + 내 경로만 (밸리 프리)
route-map TO-UP permit 10
 match community FROM-CUST
 set comm-list MY-TAGS delete
exit
!
route-map TO-UP permit 20
 match as-path LOCAL
exit
!
router bgp 100
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 timers bgp 10 30
 neighbor 10.1.2.2 remote-as 200
 neighbor 10.1.2.2 description r200-provider
 neighbor 10.1.3.2 remote-as 300
 neighbor 10.1.3.2 description r300-provider
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.1.2.2 soft-reconfiguration inbound
  neighbor 10.1.2.2 route-map PROV-IN in
  neighbor 10.1.2.2 route-map TO-UP out
  neighbor 10.1.3.2 soft-reconfiguration inbound
  neighbor 10.1.3.2 route-map PROV-IN in
  neighbor 10.1.3.2 route-map TO-UP out
 exit-address-family
exit
!
end
